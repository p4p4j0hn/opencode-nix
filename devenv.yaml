# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
version: "2"
inputs:
  opencode-nix:
    url: path:.
  nixpkgs:
    follows: opencode-nix/nixpkgs
  home-manager:
    follows: opencode-nix/home-manager
  git-hooks:
    url: github:cachix/git-hooks.nix
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
