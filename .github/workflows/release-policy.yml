name: Release policy
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify automated release integrity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/verify-release-pr.py
