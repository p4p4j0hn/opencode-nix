name: Update OpenCode binaries and schemas
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: opencode-upstream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Generate release automation app token
        id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Check out matching upstream release
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the release before checking out its exact matching source tag.
          python3 scripts/update-version.py --resolve-version > /tmp/opencode-version
          version="$(cat /tmp/opencode-version)"
          git clone --depth 1 --branch "v${version}" https://github.com/anomalyco/opencode.git upstream
          test "$(node -p "require('./upstream/packages/schema/package.json').version")" = "$version"
      - uses: oven-sh/setup-bun@v2
      - name: Generate schemas from tagged upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schemas
          cd upstream
          bun install --frozen-lockfile
          bun add --no-save react
          bun packages/cli/script/schema.ts "$GITHUB_WORKSPACE/schemas/cli.json"
          bun packages/schema/script/config-schema.ts "$GITHUB_WORKSPACE/schemas/config.json"
      - name: Refresh binary and schema hashes (also when version is unchanged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-version.py
      - name: Show refreshed version and schema pins
        run: git diff -- version.json
      - name: Update flake inputs
        run: nix flake update
      - name: Commit V2 pins to migration branch
        if: github.ref_name == 'feature/opencode-v2'
        env:
          PUSH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json schemas/ flake.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: pin verified OpenCode V2 binaries"
          git -c http.extraheader="AUTHORIZATION: basic $(printf "x-access-token:%s" "$PUSH_TOKEN" | base64 -w0)" push origin HEAD:feature/opencode-v2
      - name: Open update pull request
        if: github.ref_name != 'feature/opencode-v2'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          add-paths: |
            version.json
            schemas/
            flake.lock
          commit-message: "chore: update OpenCode pins"
          branch: automation/opencode-release
          delete-branch: true
          title: "chore: update OpenCode pins"
          body: "Automatically updated the verified OpenCode binary/schema pins and Nix flake inputs. CI must pass before merging."
