name: Update OpenCode binaries
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: opencode-upstream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate release automation app token
        id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Hash upstream release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-version.py
      - name: Commit V2 hashes to migration branch
        if: github.ref_name == 'feature/opencode-v2'
        env:
          PUSH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: pin verified OpenCode V2 binaries"
          git -c http.extraheader="AUTHORIZATION: basic $(printf "x-access-token:%s" "$PUSH_TOKEN" | base64 -w0)" push origin HEAD:feature/opencode-v2
      - name: Open update pull request
        if: github.ref_name != 'feature/opencode-v2'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          add-paths: version.json
          commit-message: "chore: update OpenCode upstream binaries"
          branch: automation/opencode-release
          delete-branch: true
          title: "chore: update OpenCode binaries"
          body: "Automatically downloaded and SHA-256 hashed all four upstream CLI assets. CI must pass before merging."
