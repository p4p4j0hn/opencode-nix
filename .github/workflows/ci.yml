name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    name: nix (${{ matrix.os == 'ubuntu-24.04' && 'ubuntu-latest' || matrix.os }})
    steps:
      - uses: actions/checkout@v6
      - name: Determine whether upstream binaries are initialized
        id: bootstrap
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("version.json"))
          ready = d["version"] != "0.0.0" and all(d["hashes"].values())
          print(f"ready={'true' if ready else 'false'}")
          PY
      - name: Explain bootstrap status
        if: steps.bootstrap.outputs.ready != 'true'
        run: echo "Binary hashes not initialized yet. Run the Update OpenCode binaries workflow, then merge its PR."
      - uses: cachix/install-nix-action@v31
        if: steps.bootstrap.outputs.ready == 'true'
      - name: Validate flake
        if: steps.bootstrap.outputs.ready == 'true'
        run: nix flake check --show-trace
      - name: Check OpenCode executable
        if: steps.bootstrap.outputs.ready == 'true'
        run: nix run . -- --version
  ubuntu26-compat:
    name: ubuntu-26.04-compat
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Validate flake on Ubuntu 26.04
        run: nix flake check --show-trace
      - name: Check OpenCode executable
        run: nix run . -- --version
