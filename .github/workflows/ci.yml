name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nix:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'automation/opencode-release' || contains(github.event.pull_request.labels.*.name, 'ci:run') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    name: nix (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v6
      - name: Determine whether upstream binaries are initialized
        id: bootstrap
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("version.json"))
          ready = d["version"] != "0.0.0" and all(d["hashes"].values())
          print(f"ready={'true' if ready else 'false'}")
          PY
      - name: Explain bootstrap status
        if: steps.bootstrap.outputs.ready != 'true'
        run: echo "Binary hashes not initialized yet. Run the Update OpenCode binaries workflow, then merge its PR."
      - uses: cachix/install-nix-action@v31
        if: steps.bootstrap.outputs.ready == 'true'
      - name: Check Nix formatting and Python formatting and Nix lint
        if: steps.bootstrap.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            # Run all checks and preserve their exit codes so every diagnostic is shown.
            nix fmt -- --ci .
            nix_status=$?
            git diff -- "*.nix"
            black --check --diff .
            black_status=$?
            statix check .
            statix_status=$?
            if [ "$nix_status" -ne 0 ] || [ "$black_status" -ne 0 ] || [ "$statix_status" -ne 0 ]; then
              exit 1
            fi
          '
      - name: Validate flake
        if: steps.bootstrap.outputs.ready == 'true'
        run: nix flake check --show-trace
      - name: Check OpenCode executable
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          nix run . -- --version
          nix run . -- --help | grep -q serve
      - name: Runtime integration tests (isolated OpenCode server)
        if: steps.bootstrap.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-link --print-out-paths .#default)"
          export OPENCODE_BIN="$package/bin/opencode"
          python3 -m unittest discover -s tests -p 'test_backend_integration.py' -v
  vm-tests:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'automation/opencode-release' || contains(github.event.pull_request.labels.*.name, 'ci:run') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    name: vm-tests (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Determine whether upstream binaries are initialized
        id: bootstrap
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("version.json"))
          ready = d["version"] != "0.0.0" and all(d["hashes"].values())
          print(f"ready={'true' if ready else 'false'}")
          PY
      - uses: cachix/install-nix-action@v31
        if: steps.bootstrap.outputs.ready == 'true'
      - name: Enable KVM for the NixOS VM tests
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run NixOS VM tests
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          nix build --no-link \
            .#vmTests.${{ matrix.system }}.nixos-smoke \
            .#vmTests.${{ matrix.system }}.nixos-private-socket
