name: Bootstrap version-matched schemas
on:
  push:
    branches: [fix/manual-schema-refresh]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[schema-bootstrap]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Generate schemas from pinned release
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          git clone --depth 1 --branch "v${version}" https://github.com/anomalyco/opencode.git upstream
          test "$(node -p "require('./upstream/packages/schema/package.json').version")" = "$version"
          mkdir -p schemas
          (cd upstream && bun install --frozen-lockfile)
          (cd upstream && bun packages/cli/script/schema.ts "$GITHUB_WORKSPACE/schemas/cli.json")
          (cd upstream && bun packages/schema/script/config-schema.ts "$GITHUB_WORKSPACE/schemas/config.json")
          python3 - <<'PY'
          import json,hashlib,base64
          from pathlib import Path
          path=Path('version.json')
          data=json.loads(path.read_text())
          for kind in ('cli','config'):
              payload=(Path('schemas')/f'{kind}.json').read_bytes()
              data['schemaHashes'][kind]='sha256-'+base64.b64encode(hashlib.sha256(payload).digest()).decode()
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit generated schema snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: bootstrap release-matched schemas [schema-bootstrap]"
          git -c http.extraheader="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)" push origin HEAD:fix/manual-schema-refresh
